plugins {
    id "com.android.application"
}

def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as int

android {
    namespace "com.tracesofpain.kiosk"
    compileSdk 35

    defaultConfig {
        applicationId "com.tracesofpain.kiosk"
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "1.0." + buildNumber
    }

    // Signing key from the GitHub secrets KIOSK_KEYSTORE / KIOSK_KEYSTORE_PASSWORD (see README).
    // The same key on every build lets a new APK install over the old one. Without it, the build
    // uses a throwaway debug key.
    def ksFile = System.getenv("KIOSK_KEYSTORE_FILE")
    def ksPass = System.getenv("KIOSK_KEYSTORE_PASSWORD")
    def haveKey = ksFile && ksPass && file(ksFile).exists()

    signingConfigs {
        if (haveKey) {
            kiosk {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias "kiosk"
                keyPassword ksPass
                storeType "pkcs12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig haveKey ? signingConfigs.kiosk : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
