<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traces of Pain Guide</title>
<meta name="description" content="Visitor guide to Traces of Pain, an exhibition by Gabriel Matula.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="gate.js"></script>
</head>
<body>
<header class="bar" id="bar">
  <a class="wordmark" href="#">Gabriel Matula <span>Traces of Pain</span></a>
  <button class="jump-btn" id="jumpBtn" type="button" aria-haspopup="dialog">No.</button>
</header>
<main id="view" tabindex="-1"></main>

<div class="fs" id="fs" hidden>
  <div class="fs-top">
    <span class="fs-count" id="fsCount"></span>
    <button class="fs-toggle" id="fsToggle" type="button" aria-pressed="true"></button>
    <button class="fs-close" id="fsClose" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="fs-stage" id="fsStage">
    <div class="fs-frame" id="fsFrame">
      <img id="fsImg" alt="">
      <div class="fs-dots" id="fsDots"></div>
    </div>
  </div>
  <p class="fs-hint" id="fsHint"></p>
  <button class="fs-nav prev" id="fsPrev" type="button" aria-label="Previous">&#8249;</button>
  <button class="fs-nav next" id="fsNext" type="button" aria-label="Next">&#8250;</button>
  <section class="sheet" id="sheet" hidden aria-live="polite">
    <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">&times;</button>
    <h3 id="sheetTitle"></h3>
    <p id="sheetText"></p>
  </section>
</div>

<div class="jump" id="jump" hidden role="dialog" aria-labelledby="jumpTitle">
  <form class="jump-box" id="jumpForm">
    <label id="jumpTitle" for="jumpInput"></label>
    <p class="jump-hint" id="jumpHint"></p>
    <input id="jumpInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="3">
    <div class="keypad" id="keypad"></div>
    <p class="jump-err" id="jumpErr" aria-live="polite"></p>
  </form>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
