<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Exhibition QR code</title>
<link rel="stylesheet" href="https://use.typekit.net/bin2juv.css">
<script src="vendor/qrcode.js"></script>
<style>
  /* Printable QR card for the exhibition: open qr.html on the site the QR should lead to
     (https://tracesofpain.com/qr.html or https://filipmmasek.github.io/traces-of-pain-guide/qr.html), pick a version and use Print > Save as PDF (A5, margins none, background graphics on). */
  @page { size: 148mm 210mm; margin: 0; }
  html, body { margin: 0; padding: 0; }
  body { background: #2a2a2a; font: 14px/1.4 system-ui, sans-serif; color: #ececec; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 16px; }
  .bar button { font: inherit; color: inherit; background: none; border: 1px solid #ececec; padding: 8px 14px; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: #ececec; color: #111; }
  .bar small { flex-basis: 100%; text-align: center; opacity: .7; }
  .sheet { display: flex; justify-content: center; padding: 0 16px 32px; }
  .card { width: 148mm; height: 210mm; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14mm;
          box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
  .card.dark  { background: #0f0f0f; color: #ececec; }
  .card.plain { background: #fff; color: #111; }
  .card svg { width: 100mm; height: 100mm; display: block; }
  .card p { margin: 0; font-family: "spalla", Georgia, serif; font-weight: 700; font-size: 14.5pt; letter-spacing: .04em;
            text-transform: uppercase; white-space: nowrap; }
  @media print {
    body { background: none; }
    .bar { display: none; }
    .sheet { padding: 0; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <button type="button" data-mode="dark" aria-pressed="true">Dark</button>
  <button type="button" data-mode="plain" aria-pressed="false">Plain (white)</button>
  <button type="button" id="print">Print / Save as PDF</button>
  <button type="button" id="svg">Download QR (SVG)</button>
  <small>QR leads to <b id="addr"></b> (the site this page is open on).</small>
  <small>Print settings: paper A5, margins none, background graphics on.</small>
</div>
<div class="sheet">
  <div class="card dark" id="card">
    <div id="qr"></div>
    <p>More info / Více informací / Más información</p>
  </div>
</div>
<script>
(function () {
  // The QR leads to the site this page is opened on, so the same page makes a code for
  // tracesofpain.com and for the GitHub Pages copy (filipmmasek.github.io/traces-of-pain-guide/).
  var URL_ = /^https?:$/.test(location.protocol) ? location.origin + location.pathname.replace(/[^\/]*$/, "") : "https://tracesofpain.com/";
  if (URL_ === "https://tracesofpain.com/") URL_ = "https://tracesofpain.com";
  document.getElementById("addr").textContent = URL_.replace(/^https:\/\//, "");
  var q = qrcode(0, "Q"); q.addData(URL_); q.make();
  var n = q.getModuleCount(), b = 4, s = n + 2 * b, d = "";
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + (c + b) + " " + (r + b) + "h1v1h-1z";
  var card = document.getElementById("card"), box = document.getElementById("qr"), mode = "dark";
  function svg(fg, bg) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + s + ' ' + s + '" shape-rendering="crispEdges">' +
      (bg ? '<rect width="' + s + '" height="' + s + '" fill="' + bg + '"/>' : '') + '<path fill="' + fg + '" d="' + d + '"/></svg>';
  }
  function colours() { return mode === "dark" ? ["#ececec", "#0f0f0f"] : ["#111111", "#ffffff"]; }
  function draw() { var c = colours(); box.innerHTML = svg(c[0]); card.className = "card " + mode; }
  document.querySelectorAll("[data-mode]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      mode = btn.getAttribute("data-mode");
      document.querySelectorAll("[data-mode]").forEach(function (o) { o.setAttribute("aria-pressed", String(o === btn)); });
      draw();
    });
  });
  document.getElementById("print").addEventListener("click", function () { window.print(); });
  document.getElementById("svg").addEventListener("click", function () {
    var c = colours(), a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([svg(c[0], c[1])], { type: "image/svg+xml" }));
    a.download = "traces-of-pain-qr-" + (location.hostname.indexOf("github.io") > -1 ? "github-" : "") + mode + ".svg"; a.click();
  });
  draw();
  // Fit the caption to the card width once Spalla has loaded.
  function fit() {
    var t = card.querySelector("p"), max = card.clientWidth * 0.86, size = 15;
    t.style.fontSize = size + "pt";
    while (t.scrollWidth > max && size > 8) { size -= 0.25; t.style.fontSize = size + "pt"; }
  }
  fit(); if (document.fonts) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
